<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — AvatarForge AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}"></head><body class="account-page"><main class="account-shell shell"><section class="account-card"><span class="kicker">Account recovery</span><h1>Reset your password.</h1><p class="account-lead">Enter your account email. If it exists, AvatarForge will send a time-limited reset link.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,text in messages %}<div class="form-alert {{ category }}">{{ text }}</div>{% endfor %}{% endwith %}<form method="post" class="account-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" autocomplete="email" required></label><button class="account-primary" type="submit">Send reset link</button></form><p class="account-switch"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></section></main></body></html>
