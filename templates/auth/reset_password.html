<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose password — AvatarForge AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}"></head><body class="account-page"><main class="account-shell shell"><section class="account-card"><span class="kicker">Secure recovery</span><h1>Choose a new password.</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,text in messages %}<div class="form-alert {{ category }}">{{ text }}</div>{% endfor %}{% endwith %}<form method="post" class="account-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" minlength="8" maxlength="128" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="8" maxlength="128" required></label><button class="account-primary" type="submit">Update password</button></form></section></main></body></html>
